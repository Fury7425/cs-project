<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연세 역사 탐험</title>
<!-- ponytail: pixel Korean font from CDN, falls back to monospace offline -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root { --w: min(768px, 100vw, calc((100vh - 110px) * 256 / 224)); }
  body { margin: 0; background: #111; color: #fff; font-family: 'Galmuri11', monospace;
         display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
  #hud { width: var(--w); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 6px 0; font-size: 13px; }
  #hr { margin-left: auto; text-align: right; }
  #wrap { position: relative; width: var(--w); aspect-ratio: 256 / 224; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; background: #000; }
  #dlg { display: none; position: absolute; left: 3%; right: 3%; bottom: 3%; min-height: 24%; box-sizing: border-box;
         background: #000; border: 4px double #fff; padding: 10px 14px; font-size: clamp(12px, 2.3vw, 18px); line-height: 1.6; }
  #dn { display: block; color: #fc0; }
  #dc div { cursor: pointer; }
  #dc div.on { color: #4af; }
  #dm { position: absolute; right: 10px; bottom: 4px; font-style: normal; animation: blink 1s steps(2) infinite; }
  #ov { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  #ov h1 { font-size: clamp(22px, 5vw, 40px); margin: 0; color: #4a8cff; }
  #ov h2 { font-size: clamp(16px, 3.5vw, 26px); margin: 0; }
  #ov p { margin: 0; line-height: 1.6; }
  #ov button { font: inherit; background: #1a3f95; color: #fff; border: 2px solid #4a8cff; padding: 6px 14px; cursor: pointer; }
  .dim { color: #888; }
  .gold { color: #fc0; }
  .blink { animation: blink 1s steps(2) infinite; }
  #help { font-size: 12px; color: #888; margin: 6px 0; text-align: center; }
  #pad { display: none; width: var(--w); justify-content: space-between; align-items: center; padding: 8px 12px;
         box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
  #dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); }
  #pad button { font: inherit; font-size: 20px; background: #2a2a2a; color: #fff; border: 2px solid #666; border-radius: 8px; touch-action: none; }
  #ab { display: flex; gap: 14px; }
  #ab button { width: 64px; height: 64px; border-radius: 50%; }
  #cut { display: none; position: absolute; inset: 0; background: #000; }
  #cs { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #cap, #ctag, #cskip { position: absolute; height: 11.9%; display: flex; align-items: center; }
  #cap { left: 0; right: 0; bottom: 0; justify-content: center; text-align: center; white-space: pre-line;
         font-size: clamp(11px, 2.1vw, 16px); line-height: 1.5; padding: 0 12px; }
  #ctag { left: 12px; top: 0; color: #9a9ab4; font-size: clamp(10px, 1.8vw, 13px); letter-spacing: .15em; }
  #cskip { right: 12px; top: 0; color: #555; font-size: 11px; }
  @media (pointer: coarse) { #pad { display: flex; } #help { display: none; } }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="hud"><span id="hl">연세 역사 탐험</span><span id="hr"></span></div>
<div id="wrap">
  <canvas id="c" width="256" height="224"></canvas>
  <div id="dlg"><b id="dn"></b><span id="dt"></span><div id="dc"></div><i id="dm">▼</i></div>
  <div id="ov"></div>
  <div id="cut"><canvas id="cs" width="384" height="336"></canvas><div id="ctag"></div><div id="cskip">Z 다음 · Esc 건너뛰기</div><div id="cap"></div></div>
</div>
<div id="pad">
  <div id="dpad">
    <button data-d="up" style="grid-area:1/2">▲</button><button data-d="left" style="grid-area:2/1">◀</button>
    <button data-d="right" style="grid-area:2/3">▶</button><button data-d="down" style="grid-area:3/2">▼</button>
  </div>
  <div id="ab"><button id="bb">B<br><small>달리기</small></button><button id="ba">A</button></div>
</div>
<p id="help">방향키/WASD 이동 · Z/스페이스 말하기 · Shift/X 달리기 · M 소리 끄기/켜기</p>

<script>
const g = document.getElementById('c').getContext('2d');

// ---------- sound (WebAudio chiptune, no assets) ----------
let ac, muted = false, musT, musI = 0;
const midi = m => 440 * 2 ** ((m - 69) / 12);
function beep(f, dur = .08, type = 'square', vol = .05, slide = 0) {
  if (muted) return;
  try {
    ac ||= new AudioContext();
    const o = ac.createOscillator(), v = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, t + dur);
    v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(v).connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch { /* no audio: play silently */ }
}
const seqSfx = (notes, gap = 80) => notes.forEach((m, i) => setTimeout(() => beep(midi(m), .1), i * gap));
const SFX = {
  blip: () => beep(1200, .02, 'square', .015),
  pick: () => seqSfx([83, 88]),
  rec: () => seqSfx([76, 83], 60),
  quest: () => seqSfx([72, 76, 79, 84]),
  ok: () => seqSfx([79, 84, 88], 70),
  bad: () => beep(220, .3, 'sawtooth', .05, -120),
  bump: () => beep(90, .05, 'triangle', .05),
};
// eighth-note melodies (MIDI numbers, 0 = rest); bass plays the bar's first note two octaves down
const TUNES = [
  [[72, 0, 76, 79, 81, 79, 76, 0, 74, 0, 76, 74, 72, 0, 67, 0, 72, 0, 76, 79, 84, 81, 79, 0, 76, 79, 76, 74, 72, 0, 0, 0], 160],
  [[67, 71, 74, 79, 78, 74, 71, 74, 72, 76, 79, 84, 83, 79, 76, 79, 74, 78, 81, 86, 84, 81, 78, 74, 79, 0, 74, 0, 79, 0, 0, 0], 140],
  [[69, 0, 72, 0, 76, 0, 74, 72, 71, 0, 0, 0, 64, 0, 0, 0, 69, 0, 72, 0, 77, 76, 74, 72, 69, 0, 0, 0, 64, 0, 0, 0], 230],
  [[57, 64, 69, 72, 76, 72, 69, 64, 53, 60, 65, 69, 72, 69, 65, 60, 55, 62, 67, 71, 74, 71, 67, 62, 52, 59, 64, 68, 71, 68, 64, 59], 210], // cutscenes
];
function music(tune) {
  clearInterval(musT); musI = 0;
  if (!tune) return;
  const [seq, ms] = tune;
  musT = setInterval(() => {
    const i = musI++ % seq.length, m = seq[i];
    if (m) beep(midi(m), ms / 1000 * .9, 'square', .02);
    if (i % 8 === 0 && seq[i]) beep(midi(seq[i] - 24), ms * 4 / 1000, 'triangle', .05);
  }, ms);
}

    const sx = e.x * 16 - cx, sy = e.y * 16 - cy;

    ["1885년 4월 10일, 광혜원이 문을 열었다.\n한국 최초의 서양식 병원 — 연세의 시작이었다.", A3]] },
  { tag: 'CHAPTER 2 · 1904–1917', shots: [
    ["1904년 9월, 서울역 앞.\n세브란스기념병원이 완공되었다.", B1],
    ["1917년, 신촌 — 옛 연희궁 터.\n백양나무 길 끝에서 언더우드가 꿈꾸던 대학이 올라가기 시작했다.", B2]] },
  { tag: 'CHAPTER 3 · 1942', shots: [
    ["1942년. 언더우드의 동상이 서 있던 자리에\n일제는 '흥아유신기념탑'을 세웠고, 조선어 강좌는 사라졌다.", C1],
    ["그러나 불 꺼진 교정의 한 켠에서는\n누군가 우리말 원고를 밤새 베껴 쓰고 있었다.", C2]] },
];

const VIG = mkq(384, 256, () => {
  const gr = q.createRadialGradient(192, 128, 70, 192, 128, 260);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
  q.fillStyle = gr; q.fillRect(0, 0, 384, 256);
});
function startShot() {
  const [cap, make] = cs.sc.shots[cs.i];
  q = cg; cs.draw = make(); cs.cap = cap; cs.f = 0; cs.n = 0; cs.lf = 0;
  $('cap').textContent = ''; $('ctag').textContent = `${cs.sc.tag} · ${cs.i + 1}/${cs.sc.shots.length}`;
}
function cutNext() { if (cs.lf) return; if (cs.n < cs.cap.length) cs.n = cs.cap.length; else cs.lf = 1; $('cap').textContent = cs.cap.slice(0, cs.n); }
function cutEnd() { const f = cs.next; cs = null; $('cut').style.display = 'none'; mode = 'play'; f(); }
function stepCut() {
  cs.f++;
  if (cs.lf) { if (++cs.lf > 24) { if (++cs.i >= cs.sc.shots.length) cutEnd(); else startShot(); } return; }
  if (cs.f > 40 && cs.n < cs.cap.length && cs.f % 2 === 0) { cs.n++; $('cap').textContent = cs.cap.slice(0, cs.n); if (cs.n % 3 === 0) SFX.blip(); }
  else if (cs.n >= cs.cap.length) $('cap').textContent = cs.cap;
}
function drawCut() {
  q = cg; cg.fillStyle = '#000'; cg.fillRect(0, 0, 384, 336);
  cg.save(); cg.beginPath(); cg.rect(0, 40, 384, 256); cg.clip(); cg.translate(0, 40);
  cs.draw(cs.f);
  cg.restore();
  cg.drawImage(VIG, 0, 40);
  const a = cs.lf ? Math.min(1, cs.lf / 24) : 1 - Math.min(1, cs.f / 36);
  if (a > 0) { cg.fillStyle = `rgba(0,0,0,${a})`; cg.fillRect(0, 40, 384, 256); }
}

// fixed 60Hz step so speed is the same on 120/144Hz screens
let acc = 0, last = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(t => { last = t; loop(t); });

const saved = +(store.get('yonsei-act') || 0);
overlay(`<h1>연세 역사 탐험</h1><p>1885 – 1945 · 미래를 향한 연세 역사</p>
  <p class="dim">방향키로 걷고, Z 키로 사람들과 이야기하세요.<br>퀘스트를 끝내야 다음 막으로 갈 수 있어요.</p>
  ${saved > 0 ? `<button>이어하기 — 제${saved + 1}막 (C)</button>` : ''}
  <p class="blink">Z 키를 눌러 처음부터 시작</p>`,
  () => cut(0, () => load(0)), saved > 0 ? () => load(saved) : null);
</script>
</body>
